<main id="main" data-for-page>
<span id="for-page" hidden></span>

<section class="wrap narrow" style="padding-top:clamp(3rem,10vw,5rem);">

  <div id="for-card" class="gift-card" hidden>
    <p class="label" id="for-to" style="font-size:0.7rem;letter-spacing:0.22em;text-transform:uppercase;font-weight:700;opacity:0.7;margin:0 0 1rem 0;">{{t:for.forYou}}</p>
    <p id="for-note" style="font-family:var(--serif);font-size:clamp(1.25rem,3.4vw,1.75rem);line-height:1.7;margin:0;"></p>
    <p id="for-from" hidden style="font-family:var(--sans);font-size:0.9rem;opacity:0.75;margin:1.2rem 0 0 0;"></p>
    <div class="cta-row" style="margin-top:2rem;">
      <a class="btn btn-unlock" id="for-open" href="{{u:/moods/}}" data-track="mood_selected" data-track-from="gift">{{t:for.open}}</a>
    </div>
  </div>

  <div id="for-empty" hidden>
    <p class="eyebrow">{{t:for.emptyEyebrow}}</p>
    <h1>{{t:for.emptyH}}</h1>
    <p class="lede">{{t:for.emptyLede}}</p>
    <div class="cta-row">
      <a class="btn btn-primary" href="{{u:/moods/}}">{{t:for.emptyCta1}}</a>
      <a class="btn btn-ghost" href="{{u:/}}">{{t:for.emptyCta2}}</a>
    </div>
  </div>

  <noscript>
    <p class="eyebrow">{{t:for.nsEyebrow}}</p>
    <h1>{{t:for.nsH}}</h1>
    <p class="lede">{{t:for.nsLede}}</p>
    <p><a class="btn btn-primary" href="{{u:/moods/}}">{{t:for.emptyCta1}}</a></p>
  </noscript>
</section>

<section class="wrap narrow" id="for-next">
  <p class="eyebrow">{{t:for.nextEyebrow}}</p>
  <h2>{{t:for.nextH}}</h2>
  <p class="lede">{{t:for.nextLede}}</p>
  <div class="cta-row">
    <a class="btn btn-primary" href="{{u:/tools/mood-finder/}}" data-track="mood_finder_started" data-track-from="gift">{{t:for.nextCta1}}</a>
    <a class="btn btn-ghost" href="{{u:/tools/}}">{{t:for.nextCta2}}</a>
  </div>
</section>

<section class="wrap narrow">
  <p class="hint">{{t:for.aboutHintA}} <a href="{{u:/about/}}" style="color:var(--sub);">{{t:for.aboutHintLink}}</a></p>
</section>

</main>
